<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Super Sudoku video</title>
<link rel="stylesheet" href="shared.css">
<style>
  #cam { position: absolute; will-change: transform; z-index: 5; }
  #cap { position: absolute; z-index: 20; }
  #lockTop { position: absolute; z-index: 20; }
  #end { position: absolute; inset: 0; z-index: 30; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
  #end .icon { border-radius: 22%; box-shadow: 0 2em 5em rgba(2, 12, 60, 0.5); }
  .lvWord.dim { opacity: 0.4; }
  .lvWord.on { color: var(--gold-2); }
  #calW { position: absolute; z-index: 12; }
</style>
<script src="shared.js"></script>
</head>
<body>
<div id="stage"></div>
<script>
// Frame-accurate video timeline. setup(cfg) builds the scene; frame(t) draws
// time t (seconds). Game screens continue the real board from the app
// screenshot; every entered digit comes from its verified solution. Home and
// result screens are the real app screenshots.

const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const seg = (t, a, b) => clamp((t - a) / (b - a));
const easeOut = (x) => 1 - Math.pow(1 - x, 3);
const easeInOut = (x) => (x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
const backOut = (x) => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); };
const lerp = (a, b, x) => a + (b - a) * x;

let C, P, W, H, u, portrait, rtl, TL;

// Real home-screen hotspots (screenshot px).
const HOME = {
  cont: [362, 747, 545, 120],             // "Continue Today's Challenge" (cx, cy, w, h)
  dailyCard: [497, 540],
  qp: [0, 1, 2, 3].map((i) => [40 + i * 233 + 106, 1829, 222, 244]),
};

function camAt(t) {
  const k = TL.cam;
  if (t <= k[0][0]) return k[0];
  for (let i = 1; i < k.length; i++) if (t <= k[i][0]) {
    const a = k[i - 1], b = k[i], x = easeInOut(seg(t, a[0], b[0]));
    return a.map((v, j) => (j === 0 ? t : lerp(v, b[j], x)));
  }
  return k[k.length - 1];
}

function candidates(values, i) {
  const r = Math.floor(i / 9), c = i % 9, out = [];
  for (let v = 1; v <= 9; v++) {
    let ok = true;
    for (let k = 0; k < 9 && ok; k++) {
      if (values[r * 9 + k] === v || values[k * 9 + c] === v) ok = false;
      if (values[(r - (r % 3) + Math.floor(k / 3)) * 9 + c - (c % 3) + (k % 3)] === v) ok = false;
    }
    if (ok) out.push(v);
  }
  return out;
}
const empties = (vals) => vals.map((v, i) => (v ? -1 : i)).filter((i) => i >= 0);
const pick = (vals, n, off = 0) => { const e = empties(vals); return Array.from({ length: n }, (_, k) => e[(off + Math.floor(((k + 0.5) * e.length) / n)) % e.length]); };
const fill = (t, i) => ({ k: "fill", t, i });

function gameSeg(a, b, p, values, moves, meta) { return { a, b, kind: "game", puzzle: p.puzzle, solution: p.solution, values, moves, ...meta }; }
function shotSeg(a, b, name, extra = {}) { return { a, b, kind: "shot", name, rings: [], taps: [], ...extra }; }
function nearDone(p, n) {
  const e = empties(p.puzzle);
  const keep = [e[2], e[Math.floor(e.length / 2)], e[e.length - 3]].slice(0, n);
  return { values: p.solution.map((v, i) => (keep.includes(i) ? 0 : v)), last: keep };
}

function buildTimeline(kind) {
  const real = P.real, daily = P.daily;
  const dV = [...daily.puzzle]; for (const i of P.fillsDaily) dV[i] = daily.solution[i];
  const near = nearDone(daily, kind === "15s" ? 2 : 2);
  const segs = [];
  if (kind === "15s") {
    const m = pick(real.shown, 3, 1);
    segs.push(gameSeg(0, 6, real, [...real.shown], [fill(3.7, m[0]), fill(4.55, m[1]), fill(5.4, m[2])], { level: "Easy", t0: 293 }));
    segs.push(shotSeg(6, 9.1, "home", { rings: [{ a: 7.4, b: 8.75, box: HOME.cont }], taps: [{ t: 8.45, x: HOME.cont[0], y: HOME.cont[1] }] }));
    segs.push(gameSeg(9.1, 10, daily, dV, [fill(9.7, pick(dV, 1, 4)[0])], { level: "Medium", t0: 41 }));
    segs.push(gameSeg(10, 11.95, daily, near.values, [fill(10.55, near.last[0]), fill(11.2, near.last[1])], { level: "Medium", t0: 92, win: 11.25 }));
    segs.push(shotSeg(11.95, 15, "daily_result"));
    return {
      dur: 15, segs, dips: [6, 9.1, 10, 11.95],
      cam: [[0, 0.92, 0.5, 0.45, 0, 4, 0], [0.7, 1, 0.5, 0.45, 0, 0, 1], [3, 1, 0.5, 0.45, 0, 0, 1], [5.8, 1.06, 0.5, 0.4, 0, 0, 1],
        [6.1, 1, 0.5, 0.3, 0, 0, 1], [8.9, 1.12, 0.5, 0.3, 0, 0, 1], [9.15, 1, 0.5, 0.45, 0, 0, 1], [12.9, 1.03, 0.5, 0.45, 0, 0, 1], [13.5, 0.86, 0.5, 0.45, 0, 6, 0]],
      caps: [["love", 0.35, 2.85], ["challenge", 3.15, 5.85], ["daily", 6.2, 9.85], ["canYou", 10.15, 12.9]],
      cal: [6.4, 9.0], levels: null, end: 13.2,
    };
  }
  // ---------------------------------------------------------------- 30s
  const g = pick(real.shown, 4, 0);
  const after = [...real.shown]; for (const i of g) after[i] = real.solution[i];
  const ne = empties(after).filter((i) => { const c = candidates(after, i); return c.length >= 2 && c.length <= 3; });
  const nc = ne[Math.floor(ne.length / 2)] ?? empties(after)[0];
  const cand = candidates(after, nc);
  const other = empties(after).find((i) => i !== nc && Math.floor(i / 9) !== Math.floor(nc / 9));
  segs.push(gameSeg(0, 14, real, [...real.shown], [fill(5.6, g[0]), fill(6.45, g[1]), fill(7.3, g[2]), fill(8.15, g[3]),
    { k: "notesOn", t: 9.7, on: true }, { k: "sel", t: 10.15, i: nc }, ...cand.map((v, k) => ({ k: "note", t: 10.65 + k * 0.45, i: nc, v })),
    { k: "notesOn", t: 11.95, on: false }, fill(12.6, nc), fill(13.4, other)], { level: "Easy", t0: 241 }));
  const qpRings = HOME.qp.map((b, k) => ({ a: 14.5 + k * 1.1, b: 15.6 + k * 1.1, box: b }));
  segs.push(shotSeg(14, 19, "home", { rings: qpRings, taps: HOME.qp.map((b, k) => ({ t: 14.65 + k * 1.1, x: b[0], y: b[1] })) }));
  segs.push(shotSeg(19, 22.2, "home", { rings: [{ a: 20.7, b: 22.0, box: HOME.cont }], taps: [{ t: 21.75, x: HOME.cont[0], y: HOME.cont[1] }] }));
  segs.push(gameSeg(22.2, 24, daily, dV, [fill(22.9, pick(dV, 2, 4)[0]), fill(23.6, pick(dV, 2, 4)[1])], { level: "Medium", t0: 41 }));
  segs.push(gameSeg(24, 25.95, daily, near.values, [fill(24.5, near.last[0]), fill(25.15, near.last[1])], { level: "Medium", t0: 92, win: 25.2 }));
  segs.push(shotSeg(25.95, 30, "daily_result"));
  return {
    dur: 30, segs, dips: [14, 19, 22.2, 24, 25.95],
    cam: [[0, 1.55, 0.5, 0.33, 0, 0, 0], [0.5, 1.58, 0.5, 0.33, 0, 0, 1], [4.2, 1.7, 0.5, 0.33, 0, 0, 1], [5.1, 1, 0.5, 0.45, 0, 0, 1],
      [9.1, 1, 0.5, 0.45, 0, 0, 1], [9.7, 1.3, 0.5, 0.7, 0, 0, 1], [13.7, 1.3, 0.5, 0.7, 0, 0, 1], [14.05, 1.32, 0.5, 0.9, 0, 0, 1],
      [18.8, 1.38, 0.5, 0.9, 0, 0, 1], [19.05, 1.1, 0.5, 0.3, 0, 0, 1], [22.0, 1.18, 0.5, 0.3, 0, 0, 1], [22.25, 1, 0.5, 0.45, 0, 0, 1],
      [26.6, 1.03, 0.5, 0.45, 0, 0, 1], [27.3, 0.86, 0.5, 0.45, 0, 6, 0]],
    caps: [["hook", 0.45, 4.3], ["levels", 14.25, 18.85], ["dailyB", 19.25, 23.85], ["solved", 25.4, 27.0]],
    cal: [19.4, 22.1], levels: [14.5, 1.1], end: 27.3,
  };
}

const SHOTS = ["home", "daily_result"];
async function preload() {
  await Promise.all(["icon", "calendar", ...SHOTS].map((n) => { const i = new Image(); i.src = `assets/app/${n}.png`; return i.decode(); }));
}

async function setup(cfg) {
  await preload();
  C = cfg.copy; P = { ...cfg.puzzles, fillsDaily: cfg.fills.daily }; W = cfg.W; H = cfg.H;
  portrait = H > W; rtl = cfg.dir === "rtl"; u = Math.min(W, H) / 100;
  TL = buildTimeline(cfg.kind);
  const scriptCls = cfg.script === "latin" ? "lat" : cfg.script === "arab" ? "ar" : "cx";
  const pw = (portrait ? 56 : 40) * u;
  const px = portrait ? (W - pw) / 2 : rtl ? W * 0.265 - pw / 2 : W * 0.735 - pw / 2;
  const py = portrait ? 50 * u : (H - pw * PHONE_RATIO) / 2;
  TL.phone = { pw, px, py };
  document.getElementById("stage").innerHTML = `<div class="canvas ${scriptCls}" dir="${cfg.dir}" lang="${cfg.lang}" style="--W:${W}px;--H:${H}px;--u:${u}px">
    <div class="bg"><div class="grid"></div></div><div id="tiles"></div>
    <div id="cam" style="left:${px}px;top:${py}px;width:${pw}px;height:${pw * PHONE_RATIO}px">${phone("", { pw, x: 0, y: 0 })}</div>
    <div id="calW"></div><div id="lockTop">${lockup((portrait ? 4.4 : 3.4) * u)}</div><div id="cap"></div><div id="end"></div></div>`;
  const canvas = document.querySelector(".canvas");
  canvas.style.fontFamily = cfg.font;
  const lt = document.getElementById("lockTop");
  lt.style.cssText = portrait ? `left:0;right:0;top:${6 * u}px;display:flex;justify-content:center` : `top:${8 * u}px;${rtl ? "right" : "left"}:${8 * u}px`;

  // captions
  const cap = document.getElementById("cap");
  const capW = portrait ? W - 14 * u : W * 0.5 - 16 * u;
  const capH = portrait ? 31 * u : 62 * u;
  cap.style.cssText = portrait ? `left:${7 * u}px;width:${capW}px;top:${15 * u}px;height:${capH}px` : `${rtl ? "right" : "left"}:${8 * u}px;width:${capW}px;top:${20 * u}px;height:${capH}px`;
  const lh = scriptCls === "lat" ? 1.08 : 1.34;
  const hS = (portrait ? 9.6 : 8.6) * u;
  TL.capEls = {};
  for (const [key] of TL.caps) {
    const el = document.createElement("div");
    el.className = "h";
    el.style.cssText = `position:absolute;width:${capW}px;opacity:0;text-align:${portrait ? "center" : rtl ? "right" : "left"};${!portrait ? (rtl ? "right:0;" : "left:0;") : ""}`;
    if (key === "levels") el.innerHTML = C.lv.map((w, k) => `<span class="lvWord" data-k="${k}">${w}</span>`).join(`<span style="opacity:.5">\u00A0• </span>`);
    else el.textContent = C.v[key];
    cap.appendChild(el);
    const start = key === "levels" ? hS * 0.72 : hS;
    fitText(el, start, key === "levels" ? 2 * start * lh : portrait ? capH : 40 * u, 4 * u);
    const r = el.getBoundingClientRect();
    el.style.top = (key === "levels" && portrait ? capH * 0.15 : (capH - r.height) / 2) + "px";
    TL.capEls[key] = el;
  }
  // real calendar card, floating beside the phone during Daily Challenge
  const cw = (portrait ? 46 : 30) * u;
  const calX = portrait ? (rtl ? 3 * u : W - cw - 3 * u) : rtl ? px + pw - cw * 0.25 : px - cw * 0.75;
  const calY = portrait ? py + pw * 1.05 : py + pw * 1.05;
  const calW = document.getElementById("calW");
  calW.style.cssText = `left:${calX}px;top:${calY}px;width:${cw}px`;
  calW.innerHTML = `<div class="card" style="position:relative;width:100%"><img src="assets/app/calendar.png"></div>`;
  if (!portrait && !rtl && calX < W * 0.5) calW.style.left = W * 0.5 + 1 * u + "px";
  // tiles
  const tdef = [[5, "gold", 8, -0.34, 0.14], [3, "", 6.5, 1.1, 0.06], [9, "blue", 7.5, 1.14, 0.6], [4, "", 6, -0.3, 0.62]];
  TL.tiles = tdef.map(([d, k, s, fx, fy], n) => {
    const S = s * u * (portrait ? 1.2 : 1);
    let x = px + (rtl ? 1 - fx - S / pw : fx) * pw;
    const y = py + fy * pw * PHONE_RATIO;
    if (!portrait && (rtl ? x + S > W * 0.5 : x < W * 0.5)) return null;
    x = clamp(x, 2 * u, W - 2 * u - S);
    return { d, k, S, x, y, n };
  }).filter(Boolean);
  // end card
  const end = document.getElementById("end");
  const icon = (portrait ? 22 : 17) * u;
  end.innerHTML = `<img class="icon" src="assets/app/icon.png" style="width:${icon}px;height:${icon}px">
    <div class="h" id="endT" style="margin-top:${(portrait ? 6 : 4) * u}px;width:${portrait ? 86 * u : 120 * u}px"></div>
    <div style="margin-top:${(portrait ? 6 : 4) * u}px">${cta(C.v.install, (portrait ? 5 : 4) * u)}</div>
    <div style="margin-top:${(portrait ? 3.4 : 2.6) * u}px">${avail(C.available, (portrait ? 3.4 : 2.6) * u)}</div>`;
  document.getElementById("endT").textContent = C.v.play;
  fitText(document.getElementById("endT"), (portrait ? 9 : 7.5) * u, (portrait ? 2 : 1) * (portrait ? 9 : 7.5) * u * 1.4, 3 * u);
  fitWidth(end.querySelector(".cta"), (portrait ? 5 : 4) * u, W - 16 * u, 2.5 * u);

  // sound-design events
  const ev = [];
  for (const s of TL.segs) {
    if (s.kind === "game") {
      for (const m of s.moves) {
        if (m.k === "fill" || m.k === "note") ev.push({ t: m.t - 0.42, type: "tap" }, { t: m.t - 0.12, type: "tap" }, { t: m.t, type: m.k });
        else ev.push({ t: m.t, type: "tap" });
      }
      if (s.win) ev.push({ t: s.win + 0.05, type: "win" });
    } else for (const tp of s.taps) ev.push({ t: tp.t, type: "tap" }, { t: tp.t + 0.02, type: TL.levels ? "level" : "pop" });
  }
  for (const d of TL.dips) ev.push({ t: d, type: "swoosh" });
  ev.push({ t: TL.end + 0.25, type: "end" });
  return { dur: TL.dur, events: ev };
}

function gameState(s, t) {
  const values = [...s.values], notes = {}, pop = {}, taps = [];
  let selected = null, keyOn = null, notesOn = false;
  for (const m of s.moves) {
    if (m.k === "notesOn") { if (t >= m.t) notesOn = m.on; if (t >= m.t && t < m.t + 0.4) taps.push({ at: GEO.tool.notes, p: seg(t, m.t, m.t + 0.4) }); continue; }
    if (m.k === "sel") { if (t >= m.t) selected = m.i; if (t >= m.t && t < m.t + 0.4) taps.push({ at: GEO.cell(m.i), p: seg(t, m.t, m.t + 0.4) }); continue; }
    const tSel = m.t - 0.42, tKey = m.t - 0.12;
    const v = m.k === "note" ? m.v : s.solution[m.i];
    if (m.k === "fill" && t >= tSel) selected = m.i;
    if (m.k === "fill" && t >= tSel && t < tSel + 0.4) taps.push({ at: GEO.cell(m.i), p: seg(t, tSel, tSel + 0.4) });
    if (t >= tKey && t < tKey + 0.4) taps.push({ at: GEO.key(v), p: seg(t, tKey, tKey + 0.4) });
    if (t >= tKey && t < m.t + 0.35) keyOn = v;
    if (t >= m.t) {
      if (m.k === "fill") { values[m.i] = v; delete notes[m.i]; const x = seg(t, m.t, m.t + 0.3); if (x < 1) pop[m.i] = 1 + 0.35 * Math.sin(Math.PI * x); }
      else (notes[m.i] = notes[m.i] || []).push(v);
    }
  }
  let wave = null;
  if (s.win != null && t >= s.win) {
    wave = {};
    const x = t - s.win;
    for (let i = 0; i < 81; i++) { const d = (Math.floor(i / 9) + (i % 9)) * 0.035; wave[i] = Math.min(seg(x, d, d + 0.25), 1 - seg(x, d + 0.3, d + 0.65)); }
    selected = null; keyOn = null;
  }
  const time = fmtTime(s.t0 + Math.max(0, Math.min(t, s.win ?? 1e9) - s.a));
  const tapHtml = taps.map((tp) => `<div class="tap" style="left:${tp.at[0]}em;top:${tp.at[1]}em;transform:scale(${0.55 + 0.7 * easeOut(tp.p)});opacity:${1 - tp.p}"></div>`).join("");
  return gameScreen({ level: s.level, time, mistakes: 0, puzzle: s.puzzle, values, selected, notes, pop, wave, keyOn, notesOn, overlay: tapHtml });
}

function shotOverlay(s, t) {
  let o = "";
  for (const r of s.rings) {
    if (t < r.a || t > r.b) continue;
    const k = Math.min(easeOut(seg(t, r.a, r.a + 0.25)), 1 - seg(t, r.b - 0.2, r.b));
    const [cx, cy, w, h] = r.box;
    o += `<div class="ring" style="left:${cx - w / 2}em;top:${cy - h / 2}em;width:${w}em;height:${h}em;opacity:${k};transform:scale(${0.94 + 0.06 * k})"></div>`;
  }
  for (const tp of s.taps) if (t >= tp.t && t < tp.t + 0.4) {
    const p = seg(t, tp.t, tp.t + 0.4);
    o += `<div class="tap" style="left:${tp.x}em;top:${tp.y}em;transform:scale(${0.55 + 0.7 * easeOut(p)});opacity:${1 - p}"></div>`;
  }
  return o;
}

function frame(t) {
  const canvas = document.querySelector(".canvas");
  canvas.style.setProperty("--gx", (portrait ? 50 : rtl ? 26.5 : 73.5) + 4 * Math.sin(t * 0.4) + "%");
  canvas.style.setProperty("--gy", (portrait ? 55 : 50) + 3 * Math.cos(t * 0.33) + "%");
  let [, sc, ox, oy, dx, dy, op] = camAt(t);
  if (portrait) {
    // Keep the zoomed phone below the caption band (caption ends at 46u).
    const ph = TL.phone.pw * PHONE_RATIO, y0 = TL.phone.py + oy * ph;
    const need = (scale) => Math.max(0, 47 * u - (y0 - oy * ph * scale + dy * u)) / u;
    // If pushing down would drop the focal point out of frame, zoom less instead.
    if (y0 + (dy + need(sc)) * u > H - 16 * u) sc = Math.max(1, (y0 - 47 * u) / (oy * ph));
    dy += need(sc);
  }
  const cam = document.getElementById("cam");
  cam.style.transformOrigin = `${ox * 100}% ${oy * 100}%`;
  cam.style.transform = `translate(${dx * u}px, ${dy * u}px) scale(${sc})`;
  cam.style.opacity = op;
  const s = TL.segs.find((s) => t >= s.a && t < s.b) || TL.segs[TL.segs.length - 1];
  const screen = cam.querySelector(".screen");
  if (!screen.querySelector("#live")) {
    // Screenshot layers are created once (decoded), the live layer is redrawn per frame.
    screen.insertAdjacentHTML("afterbegin", SHOTS.map((n) => `<div class="app shotL" data-n="${n}" style="display:none">${statusBar()}<div class="page"><img class="shot" src="assets/app/${n}.png"></div></div>`).join("") + `<div id="live" style="position:absolute;inset:0;z-index:3"></div>`);
  }
  let dip = 0;
  for (const d of TL.dips) dip = Math.max(dip, 1 - Math.abs(t - d) / 0.2);
  screen.querySelectorAll(".shotL").forEach((l) => {
    const on = s.kind === "shot" && l.dataset.n === s.name;
    l.style.display = on ? "block" : "none";
    if (on && s.name === "daily_result") {
      const k = easeOut(seg(t, s.a + 0.05, s.a + 0.45));
      l.querySelector(".page").style.cssText = `transform:scale(${0.96 + 0.04 * k});opacity:${0.4 + 0.6 * k}`;
    }
  });
  screen.querySelector("#live").innerHTML = (s.kind === "game" ? gameState(s, t) : `<div class="page" style="position:absolute;left:0;top:70em;width:995em;height:2000em">${shotOverlay(s, t)}</div>`) + (dip > 0 ? `<div class="dip" style="opacity:${clamp(dip)}"></div>` : "");

  document.getElementById("tiles").innerHTML = TL.tiles.map((tl) => {
    const vis = op * (1 - seg(t, TL.end - 0.2, TL.end + 0.3));
    return `<div class="tile ${tl.k}" style="--s:${tl.S}px;left:${tl.x}px;top:${tl.y + Math.sin(t * 0.8 + tl.n * 1.7) * 1.2 * u}px;opacity:${vis};transform:rotate(${(tl.n % 2 ? 8 : -9) + Math.sin(t * 0.6 + tl.n) * 3}deg)">${tl.d}</div>`;
  }).join("");

  const calW = document.getElementById("calW");
  if (TL.cal) {
    const [a, b] = TL.cal;
    const x = seg(t, a, a + 0.45), y = 1 - seg(t, b - 0.3, b);
    calW.style.opacity = Math.min(x, y) > 0 ? Math.min(1, x * 2) * y : 0;
    calW.style.transform = `rotate(${rtl ? -4 : 4}deg) translateY(${(1 - easeOut(x)) * 4 * u}px) scale(${0.9 + 0.1 * backOut(x)})`;
  }
  for (const [key, a, b] of TL.caps) {
    const el = TL.capEls[key];
    const i = easeOut(seg(t, a, a + 0.4)), o = seg(t, b - 0.3, b);
    el.style.opacity = i * (1 - o);
    el.style.transform = `translateY(${(1 - i) * 3 * u - o * 2 * u}px)`;
    if (key === "levels") {
      const active = Math.floor((t - TL.levels[0]) / TL.levels[1]);
      el.querySelectorAll(".lvWord").forEach((w, k) => (w.className = "lvWord" + (k === active ? " on" : k > active ? " dim" : "")));
    }
  }
  document.getElementById("lockTop").style.opacity = (1 - seg(t, TL.end - 0.3, TL.end)) * seg(t, 0.2, 0.7);
  const end = document.getElementById("end");
  end.style.opacity = t >= TL.end ? 1 : 0;
  [...end.children].forEach((kid, k) => {
    const x = easeOut(seg(t, TL.end + k * 0.12, TL.end + k * 0.12 + 0.5));
    kid.style.opacity = x;
    kid.style.transform = `translateY(${(1 - x) * 4 * u}px) scale(${k === 0 ? 0.8 + 0.2 * backOut(x) : 1})`;
  });
  const pulse = t > TL.end + 1 ? 1 + 0.035 * Math.sin((t - TL.end - 1) * Math.PI * 1.6) : 1;
  end.querySelector(".cta").style.transform = `scale(${pulse})`;
}

window.setup = setup;
window.frame = frame;
</script>
</body>
</html>
